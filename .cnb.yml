# CNB 在任意 v* 标签推送时构建 Linux x64 桌面包，并创建同名 Release。
# 默认 CNB 云构建节点为 Linux；macOS/Windows 包继续由 GitHub Actions 的
# 多平台 runner 生成，避免要求 CNB 配置未接入的自托管节点。
$:
  tag_push:
    - name: Tauri Linux Release
      runner:
        tags: cnb:arch:amd64
        cpus: 4
      docker:
        image: node:20-bookworm
      stages:
        - name: Install Rust and Linux dependencies
          script: |
            set -eu
            apt-get update
            apt-get install --yes --no-install-recommends \
              build-essential ca-certificates curl libgtk-3-dev \
              libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
              librsvg2-dev libssl-dev patchelf
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            . "$HOME/.cargo/env"
            rustc --version
            cargo --version
        - name: Install frontend dependencies
          script: npm ci
        - name: Build Linux packages
          script: |
            set -eu
            . "$HOME/.cargo/env"
            npm run tauri:build -- --bundles deb,appimage
        - name: Prepare named release assets
          script: |
            set -eu
            mkdir -p release
            deb_file="$(find src-tauri/target/release/bundle/deb -name '*.deb' -type f -print -quit)"
            appimage_file="$(find src-tauri/target/release/bundle/appimage -name '*.AppImage' -type f -print -quit)"
            test -n "$deb_file"
            test -n "$appimage_file"
            cp "$deb_file" release/local_desens_beta_linux_amd64.deb
            cp "$appimage_file" release/local_desens_beta_linux_amd64.AppImage
            sha256sum release/* > release/SHA256SUMS.txt
            {
              echo "# ${CNB_BRANCH}"
              echo
              echo "Linux x64 desktop packages built automatically from tag ${CNB_BRANCH}."
            } > release/RELEASE_NOTES.md
        - name: Create CNB Release
          type: git:release
          options:
            latest: true
            descriptionFromFile: release/RELEASE_NOTES.md
        - name: Upload Linux release assets
          image: cnbcool/attachments:latest
          settings:
            attachments:
              - release/local_desens_beta_linux_amd64.deb
              - release/local_desens_beta_linux_amd64.AppImage
              - release/SHA256SUMS.txt
