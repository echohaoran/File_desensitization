[package]
name = "desens-tauri"
version = "0.1.11"
description = "本地优先的文件脱敏与还原工具桌面核心"
authors = ["DESENS"]
edition = "2021"

[lib]
name = "desens_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tauri = { version = "2", features = [] }
uuid = { version = "1", features = ["v4", "serde"] }
zip = "2"
quick-xml = "0.37"
calamine = "0.26"
rust_xlsxwriter = "0.79"
pdf-extract = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
candle-core = { version = "0.11.0", default-features = false }
candle-transformers = { version = "0.11.0", default-features = false }
tokenizers = { version = "0.21.4", default-features = false, features = ["fancy-regex"] }
tokio = { version = "1", features = ["rt", "sync"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-process = "2.3.1"
tauri-plugin-updater = "2.11.0"

[features]
custom-protocol = ["tauri/custom-protocol"]
