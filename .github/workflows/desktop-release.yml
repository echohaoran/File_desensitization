name: Desktop packages

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# 仅在标签推送时由 release job 写入 GitHub Release；普通 main 推送只保留 Actions 产物。
permissions:
  contents: write

concurrency:
  group: desktop-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64 DMG
            os: macos-14
            target: --mac dmg
            artifact: macos-dmg
            glob: release/*.dmg
          - name: Windows x64 MSI
            os: windows-latest
            target: --win msi
            artifact: windows-msi
            glob: release/*.msi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-desktop.txt

      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          expected="${GITHUB_REF_NAME#v}"
          actual="$(node -p "require('./package.json').version")"
          test "$expected" = "$actual"

      - name: Install Python build dependencies
        run: python -m pip install --upgrade pip -r backend/requirements-desktop.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Build desktop frontend
        run: npm run build:desktop:frontend

      - name: Build local backend for target runner
        run: npm run build:desktop:backend
        env:
          PYINSTALLER_CONFIG_DIR: ${{ github.workspace }}/.build/pyinstaller-config

      - name: Package installer
        run: npx electron-builder ${{ matrix.target }} --publish never

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.glob }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          cd release-assets
          sha256sum *.dmg *.msi > SHA256SUMS.txt

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* --generate-notes --title "文件脱敏与还原工具 $TAG"
          fi
