name: Build Tauri Desktop Packages

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-14
            artifact: tauri-macos-arm64
            build_args:
            paths: |
              src-tauri/target/release/bundle/dmg/*.dmg
              src-tauri/target/release/bundle/macos/*.app
            release_paths: src-tauri/target/release/bundle/dmg/*.dmg
          - name: macOS Intel
            os: macos-13
            artifact: tauri-macos-x64
            build_args:
            paths: |
              src-tauri/target/release/bundle/dmg/*.dmg
              src-tauri/target/release/bundle/macos/*.app
            release_paths: src-tauri/target/release/bundle/dmg/*.dmg
          - name: Windows x64
            os: windows-2022
            artifact: tauri-windows-x64
            build_args: -- --bundles msi
            paths: |
              src-tauri/target/release/bundle/msi/*.msi
            release_paths: src-tauri/target/release/bundle/msi/*.msi

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri package
        run: npm run tauri:build ${{ matrix.build_args }}

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish packages to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: ${{ matrix.release_paths }}
