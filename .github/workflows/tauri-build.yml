name: Build Tauri Desktop Packages

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-14
            artifact: local_desens_macos_arm64
            build_args: -- --bundles dmg
            source_glob: src-tauri/target/release/bundle/dmg/*.dmg
            release_name: local_desens_macos_arm64.dmg
          - name: macOS Intel
            os: macos-13
            artifact: local_desens_macos_x64
            build_args: -- --bundles dmg
            source_glob: src-tauri/target/release/bundle/dmg/*.dmg
            release_name: local_desens_macos_x64.dmg
          - name: Windows x64
            os: windows-2022
            artifact: local_desens_windows_x64
            build_args: -- --bundles msi
            source_glob: src-tauri/target/release/bundle/msi/*.msi
            release_name: local_desens_windows_x64.msi
          - name: Linux x64
            os: ubuntu-24.04
            artifact: local_desens_linux_x64
            build_args: -- --bundles deb
            source_glob: src-tauri/target/release/bundle/deb/*.deb
            release_name: local_desens_linux_amd64.deb

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf

      - name: Build Tauri package
        run: npm run tauri:build ${{ matrix.build_args }}

      - name: Prepare named package
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          source_file="$(find ${{ matrix.source_glob }} -type f -print -quit)"
          test -n "$source_file"
          cp "$source_file" "release/${{ matrix.release_name }}"

      - name: Prepare named Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $sourceFile = Get-ChildItem -Path '${{ matrix.source_glob }}' -File | Select-Object -First 1
          if ($null -eq $sourceFile) { throw 'No MSI package was produced.' }
          Copy-Item $sourceFile.FullName "release/${{ matrix.release_name }}"

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release/${{ matrix.release_name }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish packages to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release/${{ matrix.release_name }}
