# Gitee CI：推送标签时构建 Linux x64 Tauri 安装包并保留为流水线制品。
# 需要在 Gitee Go 控制台启用“仓库 YAML 流水线”。macOS/Windows 需要在
# Gitee Go 中额外绑定对应平台的构建节点和 TAURI_SIGNING_* 密钥后再扩展。
image: node:20-bookworm

stages:
  - package

tauri_linux_release:
  stage: package
  only:
    - tags
  before_script:
    - apt-get update
    - >-
      apt-get install --yes --no-install-recommends build-essential ca-certificates curl
      libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      libssl-dev patchelf
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
    - . "$HOME/.cargo/env"
    - rustc --version
    - cargo --version
    - npm ci
  script:
    - . "$HOME/.cargo/env"
    - npm run tauri:build -- --bundles deb,appimage
    - mkdir -p release
    - cp "$(find src-tauri/target/release/bundle/deb -name '*.deb' -type f -print -quit)" release/local_desens_beta_linux_amd64.deb
    - cp "$(find src-tauri/target/release/bundle/appimage -name '*.AppImage' -type f -print -quit)" release/local_desens_beta_linux_amd64.AppImage
    - sha256sum release/* > release/SHA256SUMS.txt
  artifacts:
    name: "local_desens_beta_${CI_COMMIT_TAG}_linux_x64"
    paths:
      - release/
    expire_in: 14 days
